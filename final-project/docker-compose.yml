name: final-project
services:
  database:
    image: postgres:16-alpine
    container_name: final-project-db
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${EPGPORT}:${PGPORT}"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: final-project-backend
    container_name: final-project-backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      IPORT: ${IPORT}
    ports:
      - "${EPORT}:${IPORT}"
    volumes:
      - .:/app
      - /app/node_modules
    command: node --watch server.js

  frontend:
    build: .
    image: final-project-frontend
    container_name: final-project-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:frontend -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://backend:${IPORT}

volumes:
  pgdata: {}
